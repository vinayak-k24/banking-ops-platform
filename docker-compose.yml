# Local full-stack run: docker compose up --build  ->  http://localhost:3000
services:
  backend:
    build: ./backend
    environment:
      PORT: 8000
      CORS_ORIGINS: '["http://localhost:3000"]'
    env_file:
      - path: ./.env
        required: false
    ports:
      - "8000:8000"

  frontend:
    build:
      context: .
      args:
        BACKEND_URL: http://backend:8000
    environment:
      PORT: 3000
    ports:
      - "3000:3000"
    depends_on:
      - backend
